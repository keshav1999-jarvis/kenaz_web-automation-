name: Playwright Tests

# When should this workflow run?
on:
  push:
    branches: [main, master]        # run on every push to main/master
  pull_request:
    branches: [main, master]        # run on PRs targeting main/master
  workflow_dispatch:                 # also allow running it manually from the Actions tab

jobs:
  test:
    name: Run Playwright Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'              # cache npm downloads to speed up future runs

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers + their OS dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Run the test suite
      #    GitHub sets CI=true automatically, so the config's retries + forbidOnly kick in
      - name: Run Playwright tests
        id: run_tests
        env:
          # 2Captcha token used by utils/cloudflare.js to solve Cloudflare challenges.
          # Must match the secret name configured in the repo settings.
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
          BASE_URL: https://kenazperfumes.com
        run: npx playwright test

      # 6. Upload the HTML report (failed tests' screenshots/videos/traces are embedded here)
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}      # upload even when tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 7. Upload the raw test results (screenshots + videos + traces as separate files)
      #    Only runs if a previous step failed, so you only get this on test failures
      - name: Upload test results (screenshots / videos / traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      # 8. Notify Slack with the test result (runs whether tests passed or failed)
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi

          # Pull pass/fail counts out of the Playwright JSON report.
          if [ -f results.json ]; then
            read TOTAL PASSED FAILED < <(node -e '
              const r = require("./results.json");
              const s = r.stats || {};
              const passed = s.expected || 0;
              const failed = (s.unexpected || 0) + (s.flaky || 0);
              const skipped = s.skipped || 0;
              const total = passed + failed + skipped;
              process.stdout.write(`${total} ${passed} ${failed}`);
            ')
          else
            TOTAL="?"; PASSED="?"; FAILED="?"
          fi

          if [ "$TEST_OUTCOME" = "success" ]; then
            STATUS_EMOJI=":white_check_mark:"
            STATUS_TEXT="TESTS PASSED"
            COLOR="#2eb886"
            BTN_STYLE="primary"
          else
            STATUS_EMOJI=":x:"
            STATUS_TEXT="TESTS FAILED"
            COLOR="#e01e5a"
            BTN_STYLE="danger"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$COLOR",
                "blocks": [
                  {
                    "type": "section",
                    "text": { "type": "mrkdwn", "text": "*Kenaz Perfumes — Playwright Test Report*" }
                  },
                  {
                    "type": "section",
                    "text": { "type": "mrkdwn", "text": "$STATUS_EMOJI *$STATUS_TEXT*" }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Total*\n$TOTAL" },
                      { "type": "mrkdwn", "text": "*Passed*\n$PASSED" },
                      { "type": "mrkdwn", "text": "*Failed*\n$FAILED" },
                      { "type": "mrkdwn", "text": "*Suite*\nAll Tests" },
                      { "type": "mrkdwn", "text": "*Branch*\n$BRANCH" },
                      { "type": "mrkdwn", "text": "*Triggered by*\n$EVENT_NAME" }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "style": "$BTN_STYLE",
                        "text": { "type": "plain_text", "text": "View Run & Download Report" },
                        "url": "$RUN_URL"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      { "type": "mrkdwn", "text": "Device: iPhone 14 Pro Max — Mobile Chrome  |  Repo: $REPO  |  Commit: $SHORT_SHA" }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )

          curl -sS -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
