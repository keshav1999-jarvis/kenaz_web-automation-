name: CI Diagnostic

# Manual only — captures what the GitHub runner sees on the site.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose CI environment
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Show runner public IP
        run: curl -s https://api.ipify.org && echo ""

      - name: Run diagnostic
        env:
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
          BASE_URL: https://kenazperfumes.com
        run: npx playwright test tests/_diagnostic.spec.js --project="Mobile Chrome - iPhone 14 Pro Max"

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: diagnostic-output
          path: diagnostic-output/
          retention-days: 7
